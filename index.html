<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>へぇ〜！雑学クイズ</title>
  <meta name="description" content="雑学・首都・漢字・四字熟語・ことわざなど、1000問以上の4択クイズ。1回10問の100点満点。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- タイトル -->
    <section class="screen title" id="title">
      <div class="logo">
        <span class="bubble">へぇ〜！</span>
        <h1>雑学クイズ</h1>
      </div>
      <p class="lead">全<b class="total"></b>問の4択クイズ。1回10問、<br>1問10点の100点満点！</p>
      <button class="big start" data-cat="all">🎲 ぜんぶからランダム 10問</button>
      <h2>ジャンルをえらぶ</h2>
      <div class="cats"></div>
      <p class="best"></p>
    </section>

    <!-- 問題 -->
    <section class="screen play" id="play" hidden>
      <div class="hud">
        <span class="count"></span>
        <span class="combo" hidden></span>
        <span class="score">0 点</span>
      </div>
      <div class="timer"><i></i></div>
      <p class="cat-label"></p>
      <h2 class="question"></h2>
      <div class="choices"></div>
      <div class="feedback" hidden>
        <p class="verdict"></p>
        <p class="note"></p>
        <button class="big next">次へ</button>
      </div>
    </section>

    <!-- 結果 -->
    <section class="screen result" id="result" hidden>
      <p class="rank-icon"></p>
      <h2 class="rank"></h2>
      <p class="final"></p>
      <p class="record"></p>
      <div class="actions">
        <button class="big retry">もう一回</button>
        <button class="big sub share">結果をシェア</button>
        <button class="big sub home">タイトルへ</button>
      </div>
      <h3>ふりかえり</h3>
      <ol class="review"></ol>
    </section>
  </main>

  <footer>© 2026 Akito Yoshii</footer>

  <script src="questions.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
